name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            use_cross: true
          - target: x86_64-unknown-linux-musl
            use_cross: true
          - target: aarch64-unknown-linux-musl
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Web UI
        run: |
          cd web
          npm install
          npm run build
        shell: bash

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build binary
        run: |
          if [ "${{ matrix.use_cross }}" == "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash

      - name: Package artifacts
        id: package
        run: |
          BIN_NAME="rtop"
          BIN_PATH="target/${{ matrix.target }}/release/${BIN_NAME}"
          
          CLEAN_TARGET="${{ matrix.target }}"
          CLEAN_TARGET="${CLEAN_TARGET/unknown-linux-/}"
          VERSION="${{ github.ref_name }}"
          
          ARCHIVE_NAME="rtop-${VERSION}-${CLEAN_TARGET}.tar.gz"
          
          # Only archive the binary
          tar -czf "$ARCHIVE_NAME" -C "target/${{ matrix.target }}/release" "$BIN_NAME"
          
          echo "archive=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
          echo "clean_target=$CLEAN_TARGET" >> $GITHUB_OUTPUT
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rtop-${{ github.ref_name }}-${{ steps.package.outputs.clean_target }}
          path: ${{ steps.package.outputs.archive }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: false
